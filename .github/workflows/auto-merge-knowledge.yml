name: Auto-Merge Low-Risk Knowledge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files & PR body for high-blast-radius rules
        id: policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Block auto-merge if core domain rules, agent prompts, or pack code changed
          if echo "$CHANGED_FILES" | grep -E '^(knowledge/domain/|knowledge/agents/|AGENTS\.md|behavior_packs/|resource_packs/)'; then
            echo "requires_human=true" >> $GITHUB_OUTPUT
            echo "Reason: High-blast-radius path modified."
            exit 0
          fi

          # Block auto-merge if the PR explicitly flags an unresolved conflict
          if echo "$PR_BODY" | grep -qi "Needs Human Decision"; then
            echo "requires_human=true" >> $GITHUB_OUTPUT
            echo "Reason: PR contains unresolved authority conflicts."
            exit 0
          fi

          echo "requires_human=false" >> $GITHUB_OUTPUT

      - name: Approve and Auto-Merge Low-Risk PR
        if: steps.policy.outputs.requires_human == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --approve -b "Auto-approved: Only low-risk knowledge paths modified with zero conflicts."
          gh pr merge "$PR_URL" --auto --squash
